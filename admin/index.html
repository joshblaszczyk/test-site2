<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ThomKat Admin Demo</title>
<style>
  :root { --ink:#171217; --mute:#6b5b66; --line:#e6dde2; --bg:#faf6f8; --card:#fff; --pink:#c2457f; --ok:#2a7a4b; --warn:#a15c00; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f4eef2; --mute:#b5a4ae; --line:#3a2f37; --bg:#161115; --card:#201a1e; --pink:#e46aa2; --ok:#5fc589; --warn:#e0a240; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; padding:14px 16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; font-weight:600; } header h1 em { color:var(--pink); font-style:normal; }
  nav { display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; }
  button, .btn { font:inherit; border:1px solid var(--ink); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:10px; cursor:pointer; }
  button.ghost, .btn.ghost { background:transparent; color:var(--ink); border-color:var(--line); }
  button.on { background:var(--pink); border-color:var(--pink); color:#fff; }
  button.small { padding:4px 10px; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  .demo { background:var(--pink); color:#fff; text-align:center; padding:6px 12px; font-size:13px; }
  main { max-width:1000px; margin:0 auto; padding:18px 16px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  h2 { margin:0 0 12px; font-size:18px; } h3 { margin:0 0 8px; font-size:15px; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; font-size:14px; }
  th { color:var(--mute); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  td img { width:44px; height:44px; object-fit:cover; border-radius:8px; display:block; background:var(--line); }
  .pill { display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; border:1px solid var(--line); color:var(--mute); }
  .pill.ok { color:var(--ok); border-color:var(--ok); } .pill.warn { color:var(--warn); border-color:var(--warn); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  label { display:block; font-size:13px; color:var(--mute); }
  input, select, textarea { width:100%; margin-top:4px; padding:10px; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; }
  .photos { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
  .photos .ph { position:relative; } .photos img { width:84px; height:84px; object-fit:cover; border-radius:10px; border:1px solid var(--line); display:block; }
  .photos .ph button { position:absolute; top:-6px; right:-6px; width:22px; height:22px; padding:0; border-radius:50%; font-size:13px; line-height:1; }
  .samples img { width:64px; height:64px; object-fit:cover; border-radius:8px; cursor:pointer; border:2px solid transparent; } .samples img:hover { border-color:var(--pink); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; } .stat b { display:block; font-size:24px; } .stat span { color:var(--mute); font-size:13px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .msg { padding:10px 12px; border-radius:10px; background:var(--bg); border:1px solid var(--line); margin:10px 0; font-size:14px; }
  #login { max-width:380px; margin:12vh auto; }
  .scroll { overflow-x:auto; }
  .mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--mute); }
</style>
</head>
<body>
<div class="demo">DEMO ADMIN — sample data only. Nothing here is connected to a real store, bank or key.</div>

<div id="login" class="card" hidden>
  <h2>ThomKat <em style="color:var(--pink);font-style:normal">Admin</em></h2>
  <p style="color:var(--mute)">This is a demo of the shop admin. The demo password is <b>demo</b>.</p>
  <label>Password<input id="pw" type="password" autocomplete="off" placeholder="demo"></label>
  <p class="msg" id="loginErr" hidden></p>
  <p><button id="loginBtn">Sign in</button></p>
</div>

<div id="app" hidden>
  <header>
    <h1>ThomKat <em>Admin</em></h1>
    <nav>
      <button class="ghost on" data-tab="orders">Orders</button>
      <button class="ghost" data-tab="pieces">Pieces</button>
      <button class="ghost" data-tab="setup">Setup</button>
      <a class="btn ghost" href="../shop.html">View shop ↗</a>
      <button class="ghost" id="logout">Sign out</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<script src="../shop/demo-api.js"></script>
<script>
(function () {
  'use strict';
  const D = window.ThomKatDemo;
  const $ = id => document.getElementById(id);
  const money = c => '$' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const SESSION = 'thomkat.demo.admin';
  let tab = 'orders', openOrder = null, draftPhotos = [], msg = '';
  const CATEGORIES = [['Dresses', 'Dresses'], ['Tops & Sweaters', 'Tops / Sweaters'], ['Coats & Jackets', 'Coats & Jackets'], ['Suits', 'Suits'], ['Pants & Skirts', 'Pants & Skirts'],
    ['Shoes', 'Shoes'], ['Boots', 'Boots'], ['Handbags', 'Purses'], ['Jewelry', 'Jewelry'], ['Accessories', 'Accessories']];
  const SAMPLES = ['consignment-ai-sample-01-pink-blazer.png', 'consignment-ai-sample-02-ivory-blouse.png', 'consignment-ai-sample-03-black-trousers.png', 'consignment-ai-sample-04-rose-slip.png',
    'consignment-ai-sample-05-leather-jacket.png', 'consignment-ai-sample-06-cream-knit-set.png', 'consignment-ai-sample-07-vintage-print.png', 'consignment-ai-sample-08-satin-skirt.png',
    'consignment-ai-sample-09-ivory-gown.png', 'consignment-ai-sample-10-pink-handbag.png'];

  const authed = () => { try { return sessionStorage.getItem(SESSION) === '1'; } catch { return false; } };
  function gate() {
    $('login').hidden = authed(); $('app').hidden = !authed();
    if (authed()) render();
  }
  $('loginBtn').onclick = () => {
    if ($('pw').value.trim().toLowerCase() === 'demo') { try { sessionStorage.setItem(SESSION, '1'); } catch { /* ignore */ } gate(); }
    else { $('loginErr').textContent = 'Wrong password. (The demo password is “demo”.)'; $('loginErr').hidden = false; }
  };
  $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
  $('logout').onclick = () => { try { sessionStorage.removeItem(SESSION); } catch { /* ignore */ } gate(); };
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; openOrder = null; msg = ''; render(); });

  async function render() {
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    await D.ensureSeed();
    const view = $('view');
    const keep = {}; ['fName', 'fPrice', 'fCat', 'fSize', 'fColor', 'fDesc'].forEach(id => { if ($(id)) keep[id] = $(id).value; });
    if (tab === 'orders') view.innerHTML = openOrder ? orderDetail() : ordersList();
    else if (tab === 'pieces') view.innerHTML = await piecesView();
    else view.innerHTML = setupView();
    Object.keys(keep).forEach(id => { if ($(id)) $(id).value = keep[id]; });
    wire();
  }

  // ---- orders ------------------------------------------------------------------------------------
  function ordersList() {
    const os = D.state().orders;
    const paid = os.reduce((s, o) => s + o.total_cents - o.refunded_cents, 0);
    const todo = os.filter(o => o.fulfillment_status === 'new').length;
    return `<div class="stats"><div class="stat"><b>${os.length}</b><span>Orders</span></div><div class="stat"><b>${money(paid)}</b><span>Sales (demo)</span></div><div class="stat"><b>${todo}</b><span>To fulfil</span></div></div>
    <div class="card scroll"><h2>Orders</h2>${msg ? `<p class="msg">${esc(msg)}</p>` : ''}
    ${os.length ? `<table><thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Delivery</th><th>Total</th><th>Status</th></tr></thead><tbody>${os.map(o => `
      <tr><td><a href="#" data-open="${o.id}">${esc(o.number)}</a></td><td>${new Date(o.created_at).toLocaleDateString()}</td><td>${esc(o.name)}<br><span class="mono">${esc(o.email)}</span></td>
      <td>${o.fulfillment === 'pickup' ? 'Pickup' : 'Ship'}</td><td>${money(o.total_cents - o.refunded_cents)}</td><td>${statusPill(o)}</td></tr>`).join('')}</tbody></table>`
      : '<p>No orders yet. Place a test order from the shop (checkout.html).</p>'}</div>`;
  }
  function statusPill(o) {
    if (o.status === 'refunded') return '<span class="pill warn">Refunded</span>';
    const f = { new: ['To fulfil', 'warn'], shipped: ['Shipped', 'ok'], delivered: ['Delivered', 'ok'], picked_up: ['Picked up', 'ok'], ready: ['Ready for pickup', 'ok'] }[o.fulfillment_status] || ['Paid', 'ok'];
    return `<span class="pill ${f[1]}">${f[0]}</span>`;
  }
  function orderDetail() {
    const o = D.state().orders.find(x => x.id === openOrder);
    if (!o) return ordersList();
    const s = o.ship_to;
    return `<p><a href="#" data-back>← All orders</a></p><div class="card"><h2>${esc(o.number)} ${statusPill(o)}</h2>${msg ? `<p class="msg">${esc(msg)}</p>` : ''}
      <div class="grid"><div><h3>Customer</h3>${esc(o.name)}<br>${esc(o.email)}${o.phone ? '<br>' + esc(o.phone) : ''}</div>
      <div><h3>${o.fulfillment === 'pickup' ? 'Pickup' : 'Ship to'}</h3>${o.fulfillment === 'pickup' ? esc(D.PICKUP.address) : esc([s.street1, s.street2].filter(Boolean).join(', ')) + '<br>' + esc(`${s.city} ${s.state} ${s.zip}`)}</div>
      <div><h3>Payment</h3>${esc(o.card?.brand || 'CARD')} •••• ${esc(o.card?.last4 || '')}<br><span class="mono">${esc(o.payment_ref || 'demo_pay_seeded')}</span><br><span class="pill">Test payment</span></div></div>
      <table style="margin-top:14px"><tbody>${o.items.map(i => `<tr><td style="width:56px"><img src="${esc(i.image)}" alt=""></td><td>${esc(i.name)}<br><span class="mono">SKU ${esc(i.sku)}</span></td><td>${i.refunded ? '<span class="pill warn">Refunded</span>' : ''}</td><td style="text-align:right">${money(i.price_cents)}</td></tr>`).join('')}
      <tr><td></td><td>Shipping</td><td></td><td style="text-align:right">${money(o.shipping_cents)}</td></tr>
      ${o.refunded_cents ? `<tr><td></td><td>Refunded</td><td></td><td style="text-align:right">−${money(o.refunded_cents)}</td></tr>` : ''}
      <tr><td></td><td><b>Total</b></td><td></td><td style="text-align:right"><b>${money(o.total_cents)}</b></td></tr></tbody></table>
      ${o.tracking ? `<p>Tracking: ${esc(o.tracking.carrier)} <span class="mono">${esc(o.tracking.number)}</span> · <a href="#" data-label>demo label (PDF)</a></p>` : ''}
      <div class="row">
        ${o.fulfillment === 'ship' && !o.tracking && o.status !== 'refunded' ? '<button data-act="label">Buy shipping label (demo)</button>' : ''}
        ${o.fulfillment === 'pickup' && o.fulfillment_status === 'new' ? '<button data-act="ready">Mark ready for pickup</button>' : ''}
        ${o.fulfillment === 'pickup' && o.fulfillment_status === 'ready' ? '<button data-act="picked_up">Mark picked up</button>' : ''}
        ${o.fulfillment === 'ship' && o.tracking && o.fulfillment_status === 'new' ? '<button data-act="shipped">Mark shipped</button>' : ''}
        ${o.status !== 'refunded' ? '<button class="ghost" data-act="refund">Refund order (demo)</button>' : ''}
      </div></div>`;
  }
  function orderAction(act) {
    const o = D.state().orders.find(x => x.id === openOrder);
    if (!o) return;
    if (act === 'label') { o.tracking = { carrier: 'USPS', number: '9400' + Array.from(crypto.getRandomValues(new Uint8Array(9)), b => b % 10).join('') + '0001'.padStart(8, '0') }; msg = 'Demo label created. (No postage was bought.)'; }
    if (act === 'shipped') { o.fulfillment_status = 'shipped'; msg = 'Marked shipped.'; }
    if (act === 'ready') { o.fulfillment_status = 'ready'; msg = 'Marked ready for pickup.'; }
    if (act === 'picked_up') { o.fulfillment_status = 'picked_up'; msg = 'Marked picked up.'; }
    if (act === 'refund') { o.items.forEach(i => { i.refunded = true; }); o.refunded_cents = o.total_cents; o.status = 'refunded'; msg = 'Refunded in full (demo). The pieces are back on the shop.'; }
    D.save(); render();
  }

  // ---- pieces ------------------------------------------------------------------------------------
  async function piecesView() {
    const all = await D.products();
    const sold = D.soldSkus();
    const customCount = D.state().custom.length;
    const q = (window.__q || '').toLowerCase();
    const rows = all.filter(p => !q || (p.name + ' ' + p.sku).toLowerCase().includes(q)).slice(0, 60);
    return `<div class="card"><h2>Add a piece</h2>${msg ? `<p class="msg">${esc(msg)}</p>` : ''}
      <form id="addForm"><div class="grid">
        <label>Name<input id="fName" required maxlength="120" placeholder="e.g. Emerald silk wrap dress, size 8"></label>
        <label>Price ($)<input id="fPrice" type="number" min="1" step="0.01" required placeholder="49.00"></label>
        <label>Category<select id="fCat">${CATEGORIES.map(c => `<option value="${esc(c[0])}">${esc(c[1])}</option>`).join('')}</select></label>
        <label>Size<input id="fSize" maxlength="12" placeholder="8"></label>
        <label>Color<input id="fColor" maxlength="30" placeholder="Emerald"></label>
      </div>
      <label style="margin-top:12px">Description<textarea id="fDesc" rows="2" maxlength="500" placeholder="Condition, fabric, measurements…"></textarea></label>
      <h3 style="margin-top:14px">Photos</h3>
      <div class="row"><input id="fFiles" type="file" accept="image/*" multiple style="max-width:320px"><span class="mono">…or tap a sample photo:</span></div>
      <div class="row samples" style="margin-top:8px">${SAMPLES.map(s => `<img src="../${s}" data-sample="${s}" alt="sample" loading="lazy">`).join('')}</div>
      <div class="photos" id="photoList">${draftPhotos.map((p, i) => `<div class="ph"><img src="${p.card}" alt=""><button type="button" data-rm="${i}" aria-label="Remove photo">×</button></div>`).join('')}</div>
      <div class="row"><button type="submit">Add to shop</button><span class="mono">Stays in this browser only. Photos are shrunk to fit.</span></div></form></div>
      <div class="card scroll"><h2>Pieces <span class="pill">${all.length}</span> ${customCount ? `<span class="pill ok">${customCount} added by you</span>` : ''}</h2>
      <p><input id="pq" placeholder="Search pieces…" value="${esc(window.__q || '')}" style="max-width:320px"></p>
      <table><thead><tr><th></th><th>Name</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(p => {
        const st = D.statusOf(p.sku, sold); const mine = p.source === 'demo-admin';
        return `<tr><td><img src="${esc(D.thumbOf(p))}" alt="" loading="lazy"></td><td>${esc(p.name)}<br><span class="mono">SKU ${esc(p.sku)}${mine ? ' · added by you' : ''}</span></td><td>${p.price_text || money(D.priceOf(p))}</td>
        <td><span class="pill ${st === 'available' ? 'ok' : 'warn'}">${st}</span></td>
        <td>${st !== 'sold' ? `<button class="ghost small" data-hide="${esc(p.sku)}">${st === 'hidden' ? 'Show' : 'Hide'}</button>` : ''} ${mine ? `<button class="ghost small" data-del="${esc(p.sku)}">Delete</button>` : ''}</td></tr>`;
      }).join('')}</tbody></table>${all.length > 60 && !q ? '<p class="mono">Showing 60 — search to find others.</p>' : ''}</div>`;
  }
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file); const img = new Image();
      img.onload = () => { try { resolve(makeVariants(img)); } catch (e) { reject(e); } URL.revokeObjectURL(url); };
      img.onerror = () => reject(new Error('Could not read that image.'));
      img.src = url;
    });
  }
  function makeVariants(img) {
    const draw = max => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      return { url: c.toDataURL('image/jpeg', 0.78), w, h };
    };
    const card = draw(640), thumb = draw(200);
    return { card: card.url, card_w: card.w, card_h: card.h, lg: card.url, lg_w: card.w, lg_h: card.h, thumb: thumb.url, thumb_w: thumb.w, thumb_h: thumb.h, source: 'demo-admin' };
  }
  async function addSample(name) {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('sample failed')); img.src = '../' + name; });
    draftPhotos.push(makeVariants(img)); render();
  }
  async function submitPiece(ev) {
    ev.preventDefault();
    if (!draftPhotos.length) { msg = 'Add at least one photo (upload or tap a sample).'; render(); return; }
    const price = Math.round(parseFloat($('fPrice').value) * 100) / 100;
    const name = $('fName').value.trim(), cat = $('fCat').value, size = $('fSize').value.trim(), color = $('fColor').value.trim(), desc = $('fDesc').value.trim();
    const sku = 'demo' + Date.now().toString(36);
    const piece = { sku, name, regular_price: price, sale_price: null, price, price_text: '$' + price.toFixed(2), regular_text: '', color, color_filter: color.toLowerCase(), color_filter_label: color,
      size, sub: [color, size ? 'Size ' + size : ''].filter(Boolean).join(' · '), badge: size ? 'Size ' + size : 'New', item_number: '', specs: [['Condition', 'Pre-owned'], size && ['Size', size], color && ['Color', color]].filter(Boolean),
      details: desc ? [desc] : [], categories: [['Clothing', cat]], tags: [cat], stock: 1, shipping_class: 'USPS', images: draftPhotos, weight_lb: 1, source: 'demo-admin', source_sheet: '',
      search: (name + ' ' + color + ' ' + size + ' ' + desc + ' ' + cat).toLowerCase(), main_category: cat, sub_category: null, vintage: /vintage/i.test(name) };
    if (!D.addPiece(piece)) { D.state().custom.shift(); msg = 'Browser storage is full — delete a piece or use fewer/smaller photos.'; render(); return; }
    draftPhotos = []; msg = `Added “${name}”. Open the shop to see it (SKU ${sku}).`; render();
  }

  // ---- setup -------------------------------------------------------------------------------------
  function setupView() {
    const row = (name, note) => `<tr><td>${name}</td><td><span class="pill warn">Demo mode</span></td><td>${note}</td></tr>`;
    return `<div class="card"><h2>Connections</h2><p>This preview has <b>no real keys</b>. Every service below is simulated inside your browser, so there is nothing to leak.</p>
      <table><thead><tr><th>Service</th><th>Status</th><th>In this demo</th></tr></thead><tbody>
      ${row('Square payments', 'Fake card form; issues one-use “cnon:” test tokens. Card 4111 1111 1111 1111 works, 4000 0000 0000 0002 declines.')}
      ${row('Shipping (USPS)', 'Two fixed demo rates; labels are fake.')}
      ${row('eBay sync', 'Photos link to eBay’s public image servers; no seller account is connected.')}
      ${row('Email receipts', 'Off.')}</tbody></table></div>
      <div class="card"><h2>Reset demo</h2><p>Clears every order and added piece in this browser and restores the three sample orders.</p><button class="ghost" data-act="reset">Reset demo data</button></div>`;
  }

  // ---- wiring ------------------------------------------------------------------------------------
  function wire() {
    document.querySelectorAll('[data-open]').forEach(a => a.onclick = e => { e.preventDefault(); openOrder = +a.dataset.open; msg = ''; render(); });
    document.querySelectorAll('[data-back]').forEach(a => a.onclick = e => { e.preventDefault(); openOrder = null; msg = ''; render(); });
    document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { if (b.dataset.act === 'reset') { D.reset(); draftPhotos = []; msg = 'Demo data reset.'; tab = 'orders'; render(); } else orderAction(b.dataset.act); });
    document.querySelectorAll('[data-label]').forEach(a => a.onclick = e => { e.preventDefault(); msg = 'Demo label — in the live system this opens the real shipping label PDF.'; render(); });
    document.querySelectorAll('[data-sample]').forEach(i => i.onclick = () => addSample(i.dataset.sample).catch(e => { msg = e.message; render(); }));
    document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { draftPhotos.splice(+b.dataset.rm, 1); render(); });
    document.querySelectorAll('[data-hide]').forEach(b => b.onclick = () => { D.toggleHidden(b.dataset.hide); render(); });
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { D.removePiece(b.dataset.del); msg = 'Piece deleted.'; render(); });
    const f = $('fFiles'); if (f) f.onchange = async () => { for (const file of f.files) { try { draftPhotos.push(await shrink(file)); } catch (e) { msg = e.message; } } render(); };
    const form = $('addForm'); if (form) form.onsubmit = submitPiece;
    const pq = $('pq'); if (pq) pq.oninput = () => { window.__q = pq.value; const pos = pq.selectionStart; render().then(() => { const n = $('pq'); n.focus(); n.setSelectionRange(pos, pos); }); };
  }
  gate();
})();
</script>
</body>
</html>
