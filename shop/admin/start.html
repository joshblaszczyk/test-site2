<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'" />
  <title>Start here · ThomKat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%23171217'/%3E%3Ccircle cx='24' cy='24' r='11' fill='%23f04e8a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="start.css" />
</head>
<body class="start-page">
  <div class="login" id="login" hidden>
    <form class="card login-card" id="loginForm">
      <p class="mono">ThomKat shop</p>
      <h1>Start here</h1>
      <label>Admin password<input type="password" id="password" autocomplete="current-password" required /></label>
      <button class="btn" type="submit">Sign in</button>
      <p class="msg error" id="loginError" hidden></p>
    </form>
  </div>

  <div id="app" hidden>
    <header class="top">
      <div class="top-inner">
        <div><p class="mono">ThomKat shop</p><strong class="title">Start here</strong></div>
        <div class="top-actions"><a href="./">Admin</a><a href="keys.html">Keys</a><button class="link" id="logout" type="button">Sign out</button></div>
      </div>
    </header>
    <main class="start-wrap">
      <h1 class="start-title">Getting your shop ready</h1>
      <div class="start-progress" id="progress"></div>
      <div class="msg error" id="appError" role="alert" hidden></div>
      <section id="next" aria-live="polite"></section>
      <div class="start-again"><button class="btn ghost small" id="refresh" type="button">Check again</button><span class="muted" id="checked"></span></div>
      <section id="all"></section>
    </main>
  </div>
  <script src="../demo-api.js"></script>
  <script src="../demo-admin-api.js"></script>
  <script src="start.js"></script>
</body>
</html>
